[Unit]
Wants=ai-companion-codex-daemon.service
After=ai-companion-codex-daemon.service

[Service]
# Xinchao runs on the Compose bridge (172.18.0.0/16), not Docker's unused
# legacy docker0 bridge. Bind the authenticated internal API on that gateway
# so dream settlement requests survive container recreation.
Environment=AI_COMPANION_DOCKER_BRIDGE_HOST=172.18.0.1
