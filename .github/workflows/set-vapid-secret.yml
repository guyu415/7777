name: One-off - Set VAPID_PRIVATE_KEY Worker Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-vapid-secret.yml'

jobs:
  set-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set VAPID_PRIVATE_KEY secret on Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.VAPID_PRIVATE_KEY_TMP }}" | npx wrangler@3 secret put VAPID_PRIVATE_KEY --name scheduled-message-worker
