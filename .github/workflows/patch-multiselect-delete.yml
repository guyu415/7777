name: One-shot multiselect delete patch

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch, build, and commit if needed
        shell: bash
        run: |
          python3 .github/patch_multiselect_delete.py
          if git diff --quiet -- src/components/Chat/ChatWindow.jsx; then
            echo "ChatWindow already patched"
            exit 0
          fi
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Chat/ChatWindow.jsx
          git commit -m "fix(chat): make multi-select deletion atomic"
          git push origin HEAD:main
