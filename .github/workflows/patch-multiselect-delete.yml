name: One-shot multiselect delete patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply multiselect delete patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ChatWindow multi-select delete UX
        env:
          PATCH_SCRIPT_B64: ""
        run: echo "$PATCH_SCRIPT_B64" | base64 --decode | python3

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Chat/ChatWindow.jsx
          git commit -m "fix(chat): make multi-select deletion atomic"
          git push origin HEAD:main
