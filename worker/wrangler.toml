name = "scheduled-message-worker"
main = "index.js"
compatibility_date = "2024-09-23"
account_id = "e364fa0eb012df759b774bfcada11422"

[[kv_namespaces]]
binding = "CHAT_KV"
id = "ee2f737d334c4af7b56a89f83b61092c"

[ai]
binding = "AI"

[triggers]
crons = ["*/30 * * * *"]

[vars]
# GLM (智谱AI) OpenAI 兼容格式，路径已含 /v4，代码只追加 /chat/completions
# API Key 通过 Worker Secret 配置：Cloudflare 控制台 → Workers → scheduled-message-worker → Settings → Variables → CLAUDE_API_KEY
# NCM_APP_ID and NCM_PRIVATE_KEY are set as Worker Secrets via Cloudflare dashboard
#
# 必须配置的 Secrets（源码中不再有硬编码兜底）：
#   USER_PASSWORD  — 主动消息定时任务读取哪个用户的数据（原来硬编码在源码里，已移除）
#                    wrangler secret put USER_PASSWORD --name scheduled-message-worker
#   MUSIC_AUTH_KEY — 音乐代理的访问 key（可选；不配则仅允许 xiaoman.xyz Referer 访问）
#                    wrangler secret put MUSIC_AUTH_KEY --name scheduled-message-worker
#   VAPID_PRIVATE_KEY — Web Push 推送的 VAPID 私钥（base64url 的 P-256 d 值），
#                    与源码里的 VAPID_PUBLIC_KEY 配对；不配置则推送功能静默停用
#                    wrangler secret put VAPID_PRIVATE_KEY --name scheduled-message-worker
#   VAPID_SUBJECT  — 可选，VAPID 联系方式（mailto:...），默认见 vapidJwt()
#   VPS_SERVICE_KEY — /vps/push 的服务端认证密钥，供 VPS 常驻会话
#                    （ai-companion/channel-server.ts）调用，与用户登录密码无关。
#                    VPS 侧同一个值存在 /opt/ai-companion/config/vps-service-key.secret
#                    wrangler secret put VPS_SERVICE_KEY --name scheduled-message-worker
#   NCM_COOKIE     — 可选，网易云网页版 Cookie（形如 "MUSIC_U=xxx; __csrf=xxx"，
#                    浏览器登录 music.163.com 后从开发者工具复制）。/ncm/* 代理
#                    不配也能搜索和播放免费歌曲，配 VIP 账号 Cookie 可播 VIP 歌
#                    wrangler secret put NCM_COOKIE --name scheduled-message-worker
#   NCM_REAL_IP    — 可选，覆盖伪装的国内来源 IP（默认 116.25.146.177）。
#                    海外节点被网易地区限制导致 VIP 歌放不出来时，此项与
#                    X-Real-IP/X-Forwarded-For 头一起解除限制
#   日记信箱（/diary/*）的 Google Drive 访问，OAuth 到真实 Google 账号（不是
#   服务账号——服务账号在非 Workspace 的个人文件夹里没有存储配额，建文件会被
#   storageQuotaExceeded 拒绝）。一次性授权换来的 refresh_token 之后一直有效：
#   GOOGLE_DRIVE_OAUTH_CLIENT_ID / GOOGLE_DRIVE_OAUTH_CLIENT_SECRET — GCP
#                    控制台 APIs & Services → Credentials → OAuth client ID
#                    （Desktop app 类型）拿到的两个值
#                    wrangler secret put GOOGLE_DRIVE_OAUTH_CLIENT_ID --name scheduled-message-worker
#   GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN — 用上面的 client 去
#                    https://accounts.google.com/o/oauth2/v2/auth 走一次
#                    response_type=code&scope=.../auth/drive&access_type=offline&prompt=consent
#                    的同意流程，拿到 code 后用 grant_type=authorization_code
#                    换 token，响应里的 refresh_token 就是这个值（长期有效，
#                    不会随 access_token 一起过期）
#                    wrangler secret put GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN --name scheduled-message-worker
#   GOOGLE_DRIVE_DIARY_FOLDER_ID — 目标 Drive 文件夹的 ID（文件夹 URL 里
#                    /folders/ 后面那一串），文件夹本身就属于这个 OAuth 账号
#                    wrangler secret put GOOGLE_DRIVE_DIARY_FOLDER_ID --name scheduled-message-worker
