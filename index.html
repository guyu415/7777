<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="preload" as="image" href="/backgrounds/eunoia-crystal-title-v1.webp" type="image/webp" />
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no：PWA 站内禁双指缩放，也阻止 iOS 聚焦输入框时自动放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff85b3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eunoia" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS 主屏幕图标：必须不透明；放根路径避开 /assets/* 的一年强缓存 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- 浏览器标签页 favicon：没有这行会退回默认图标 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
    <title>Eunoia ✨</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
